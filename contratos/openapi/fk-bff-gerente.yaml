openapi: 3.0.3
info:
  title: fk-bff-gerente
  description: >-
    Backend-for-frontend do GerenteRelacionamento. Fronteira web -- nao e bounded context
    (CONTEXT-MAP.md). Conduz Authorization Code + PKCE + OIDC contra fk-servidor-autorizacao,
    mantem a sessao em Redis via Spring Session e expoe ao app-gerente somente o que o Angular
    precisa: identidade da sessao corrente, a carteira, e a composicao da tela de atendimento a
    partir de fk-servico-carteira-clientes e fk-servico-credito (AC30). Nenhum access token ou
    refresh token atravessa esta fronteira para o browser (AC19).

    O BFF obtem por Token Exchange um token para cada destino -- aud=servico-carteira-clientes e
    aud=servico-credito -- e nunca reencaminha o token de login (ADR-0015). Nao implementa regra
    de credito, nao fala com fk-simulador-core-legado e nao substitui a autorizacao de recurso
    feita pelos servicos: 403 e 404 apenas atravessam.
  version: "0002"
servers:
  - url: /bff
    description: Origem publica atras do nginx (docker compose), TLS local.
tags:
  - name: sessao
    description: Identidade da sessao corrente, sem expor token.
  - name: carteira
    description: Listagem da CarteiraClientes (proxy autenticado com Token Exchange).
  - name: atendimento
    description: >-
      Contas do Cliente e a composicao da tela de atendimento a partir dos dois contextos.
paths:
  /api/sessao:
    get:
      operationId: consultarSessaoAtual
      tags: [sessao]
      summary: Identidade do GerenteRelacionamento autenticado na sessao corrente
      description: >-
        O suficiente para o Angular saber quem esta logado sem inspecionar o cookie de sessao,
        que e HttpOnly e portanto inacessivel a JavaScript.
      security:
        - cookieSessao: []
      responses:
        "200":
          description: Sessao autenticada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Sem sessao autenticada (sem cookie, ou cookie invalido/expirado).
  /api/carteira/clientes:
    get:
      operationId: listarClientesDaCarteira
      tags: [carteira]
      summary: Pagina da CarteiraClientes do gerente autenticado
      description: >-
        Proxy autenticado para fk-servico-carteira-clientes: o BFF obtem por Token Exchange um
        token com audience restrita a servico-carteira-clientes (ADR-0015) e repassa a chamada.
        O BFF nunca fala com fk-simulador-core-legado (AC30) nem reimplementa a autorizacao de
        recurso, que pertence ao servico dono (ADR-0007) -- um 403 de CarteiraClientes so
        atravessa.
      security:
        - cookieSessao: []
      parameters:
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Pagina zero-based.
        - name: tamanho
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Tamanho de pagina. Limite e o mesmo de fk-servico-carteira-clientes.
      responses:
        "200":
          description: Pagina da carteira do gerente autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientesPageResponse"
        "401":
          description: Sem sessao autenticada.
        "403":
          description: >-
            Sem direito de atendimento atual -- 403 de fk-servico-carteira-clientes repassado sem
            alteracao (o BFF nao decide autorizacao de recurso).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: fk-servico-carteira-clientes indisponivel ou inalcancavel no momento.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/clientes/{clienteId}/contas:
    get:
      operationId: listarContasDoCliente
      tags: [atendimento]
      summary: ContaCorrentes do Cliente selecionado
      description: >-
        Encaminhamento autenticado para fk-servico-carteira-clientes, com token trocado para
        aquele destino. Se a tela nao precisa de composicao, encaminhar e resposta legitima do BFF
        (ADR-0013).
      security:
        - cookieSessao: []
      parameters:
        - $ref: "#/components/parameters/ClienteIdPath"
      responses:
        "200":
          description: Contas do Cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContasResponse"
        "401":
          description: Sem sessao autenticada.
        "403":
          description: Sem direito de atendimento atual -- 403 do servico dono do recurso, repassado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: fk-servico-carteira-clientes indisponivel ou inalcancavel no momento.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/clientes/{clienteId}/contas/{contaId}/atendimento:
    get:
      operationId: consultarAtendimento
      tags: [atendimento]
      summary: Modelo de apresentacao da tela de atendimento -- Cliente, ContaCorrente e limite
      description: >-
        A composicao do AC30: montada AQUI, a partir de fk-servico-carteira-clientes (identidade e
        vinculo) e fk-servico-credito (limite vigente), porque nenhum dos dois contextos precisa
        conhecer dado que nao e seu. O resultado e modelo de apresentacao, nao agregado -- ninguem
        o persiste e ninguem decide sobre ele.

        Cada servico verifica o direito de atendimento por conta propria; o BFF nao e enforcement
        point unico e tambem nao suaviza a recusa de quem e dono do recurso (ADR-0007).
      security:
        - cookieSessao: []
      parameters:
        - $ref: "#/components/parameters/ClienteIdPath"
        - name: contaId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]{1,10}$"
      responses:
        "200":
          description: Cliente, ContaCorrente e LimiteChequeEspecialVigente numa unica resposta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtendimentoResponse"
        "401":
          description: Sem sessao autenticada.
        "403":
          description: Sem direito de atendimento atual, repassado sem reinterpretacao.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: A conta nao pertence aquele Cliente, ou nao e reconhecida pelo CoreLegado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: >-
            Um dos servicos esta indisponivel. Mensagem unica de negocio: o gerente nao precisa
            saber qual dependencia caiu, e a distincao permanece em protocolo e diagnostico.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /logout:
    post:
      operationId: encerrarSessao
      tags: [sessao]
      summary: Encerra a sessao corrente e invalida o cookie
      description: >-
        Endpoint padrao do Spring Security. Escrita real, portanto sujeita a CSRF (AC20): exige o
        token do cookie XSRF-TOKEN ecoado no header X-XSRF-TOKEN.
      security:
        - cookieSessao: []
      responses:
        "204":
          description: Sessao encerrada; cookie de sessao invalidado.
        "403":
          description: Token CSRF ausente ou invalido.
components:
  parameters:
    ClienteIdPath:
      name: clienteId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]{1,10}$"
      description: >-
        Identificador do Cliente selecionado. Viaja no caminho porque a autorizacao de recurso
        acontece por Cliente e precisa preceder qualquer leitura no CoreLegado (AC23).
  securitySchemes:
    cookieSessao:
      type: apiKey
      in: cookie
      name: SESSION
      description: >-
        Cookie de sessao opaco (Spring Session/Redis), HttpOnly, Secure, SameSite=Lax. Nunca
        carrega access token ou refresh token -- eles ficam no OAuth2AuthorizedClientRepository,
        server-side.
  schemas:
    SessionResponse:
      type: object
      required: [gerenteId]
      properties:
        gerenteId:
          type: string
          description: Identificador do GerenteRelacionamento autenticado (claim sub do id_token).
          example: gerente.a
    ClienteResumo:
      type: object
      required: [clienteId, nome, cpfMascarado]
      properties:
        clienteId:
          type: string
        nome:
          type: string
        cpfMascarado:
          type: string
          example: "***.456.789-**"
    ContaResumo:
      type: object
      required: [contaId, agencia]
      properties:
        contaId:
          type: string
          example: "10001"
        agencia:
          type: string
          example: "0001"
    ContasResponse:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ContaResumo"
    AtendimentoResponse:
      type: object
      required: [cliente, conta, limiteChequeEspecialVigente, consultadoEm]
      description: >-
        O unico lugar do sistema onde Cliente, ContaCorrente e LimiteChequeEspecialVigente
        aparecem juntos -- e ele e apresentacao, nao agregado (CONTEXT-MAP.md, ADR-0013).
      properties:
        cliente:
          $ref: "#/components/schemas/ClienteResumo"
        conta:
          $ref: "#/components/schemas/ContaResumo"
        limiteChequeEspecialVigente:
          type: integer
          format: int64
          description: >-
            Valor em CENTAVOS, como inteiro (ADR-0005). A formatacao em reais pertence ao
            fk-app-gerente -- nenhum texto de interface vem do backend.
          example: 500000
        consultadoEm:
          type: string
          format: date-time
          description: Instante em que a plataforma leu o limite do CoreLegado.
    ClientesPageResponse:
      type: object
      required: [itens, pagina, tamanho, totalElementos, totalPaginas]
      properties:
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ClienteResumo"
        pagina:
          type: integer
        tamanho:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
          format: int64
    ProblemDetail:
      type: object
      description: RFC 7807 (org.springframework.http.ProblemDetail).
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
