spring:
  application:
    name: fk-bff-gerente
  session:
    store-type: redis
    redis:
      namespace: bff-gerente:session
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          servidor-autorizacao:
            client-id: ${AUTH_SERVER_BFF_CLIENT_ID:bff-gerente}
            client-secret: ${AUTH_SERVER_BFF_CLIENT_SECRET:troque-este-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,carteira.leitura
          carteira-clientes-exchange:
            provider: servidor-autorizacao
            client-id: ${AUTH_SERVER_BFF_CLIENT_ID:bff-gerente}
            client-secret: ${AUTH_SERVER_BFF_CLIENT_SECRET:troque-este-client-secret}
            authorization-grant-type: "urn:ietf:params:oauth:grant-type:token-exchange"
            scope: carteira.leitura
        provider:
          servidor-autorizacao:
            # Endpoints explicitos, nao issuer-uri: issuer-uri dispara descoberta OIDC (uma
            # chamada HTTP) na inicializacao do contexto, criando uma dependencia de ordem de
            # startup contra servidor-autorizacao estar de pe. Os paths sao fixos e conhecidos.
            #
            # Dois enderecos distintos, deliberadamente: o browser so alcanca servidor-autorizacao
            # atraves do nginx (origem publica); chamadas servidor-a-servidor (token, jwks,
            # userinfo) vao direto pela rede interna do Compose. O claim "iss" dos tokens usa o
            # endereco interno (AUTH_SERVER_ISSUER_URI) -- e o mesmo valor que
            # servico-carteira-clientes usa para validar, e nao precisa ser o que aparece na barra
            # de enderecos do navegador.
            authorization-uri: ${AUTH_SERVER_PUBLIC_URL:http://localhost:9000}/oauth2/authorize
            token-uri: ${AUTH_SERVER_ISSUER_URI:http://localhost:9000}/oauth2/token
            jwk-set-uri: ${AUTH_SERVER_ISSUER_URI:http://localhost:9000}/oauth2/jwks
            user-info-uri: ${AUTH_SERVER_ISSUER_URI:http://localhost:9000}/userinfo
            user-name-attribute: sub

bff-gerente:
  # Mesma origem publica que o browser ja usa para /oauth2/authorize (ver provider acima) --
  # e tambem onde app-gerente/nginx serve a SPA de verdade, entao e o alvo certo pos-login.
  app-public-url: ${AUTH_SERVER_PUBLIC_URL:http://localhost:4200}/
  carteira-clientes:
    base-url: ${CARTEIRA_CLIENTES_BASE_URL:http://localhost:8081}
    # nome logico, nao URI absoluta (RFC 8693: "resource" exige URI, "audience" nao).
    audience: servico-carteira-clientes

server:
  port: 8082
  servlet:
    context-path: /bff
  # Necessario atras do nginx (F7): sem isto, redirect_uri e cookies seriam computados a partir
  # do host/porta interno do container, nao da origem publica https://localhost.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
