spring:
  application:
    name: fk-servidor-autorizacao
  security:
    oauth2:
      authorizationserver:
        issuer: ${AUTH_SERVER_ISSUER_URI:http://localhost:9000}

servidor-autorizacao:
  signing-key:
    private: ${AUTH_SERVER_SIGNING_KEY_PRIVATE:}
    public: ${AUTH_SERVER_SIGNING_KEY_PUBLIC:}
  bff-client:
    client-id: ${AUTH_SERVER_BFF_CLIENT_ID:bff-gerente}
    client-secret: ${AUTH_SERVER_BFF_CLIENT_SECRET:troque-este-client-secret}
    redirect-uri: ${AUTH_SERVER_BFF_REDIRECT_URI:https://localhost:4200/bff/login/oauth2/code/servidor-autorizacao}
    post-logout-redirect-uri: ${AUTH_SERVER_BFF_POST_LOGOUT_REDIRECT_URI:https://localhost:4200/}
  # Client de servico-credito, usado somente para o Token Exchange encadeado contra
  # servico-carteira-clientes (ADR-0015). Identidade propria por deployable chamador.
  credito-client:
    client-id: ${AUTH_SERVER_CREDITO_CLIENT_ID:servico-credito}
    client-secret: ${AUTH_SERVER_CREDITO_CLIENT_SECRET:troque-este-client-secret}
  # login:senha:papel;login:senha:papel -- usuarios de demonstracao, sem identidade_db (ADR-0014).
  demo-users: ${AUTH_SERVER_DEMO_USERS:gerente.a:troque-senha-a:GERENTE_RELACIONAMENTO;gerente.b:troque-senha-b:GERENTE_RELACIONAMENTO}

server:
  port: 9000
  # O browser alcanca /oauth2/authorize e /login atraves do nginx (F7); sem isto, qualquer URL
  # absoluta que o Spring Security gere refletiria o host/porta interno do container.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
