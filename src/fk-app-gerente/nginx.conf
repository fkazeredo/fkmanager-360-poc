worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Porta 80 nao e publicada (compose.yaml so publica 4200) -- nao ha redirect HTTP->HTTPS
    # para servir, porque nao existe HTTP alcancavel de fora do container. O cookie de sessao
    # do bff-gerente e Secure de proposito (ADR-0015) e continua exercitado sobre TLS de verdade
    # na porta publicada.
    server {
        listen 4200 ssl;
        listen [::]:4200 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/dev-localhost.crt;
        ssl_certificate_key /etc/nginx/certs/dev-localhost.key;

        # Ate a porta publica ser a 443, um bloco `listen 80` separado redirecionava HTTP para
        # HTTPS. Com uma unica porta publicada, esse degrau sumiu -- e digitar "localhost:4200"
        # no browser, que assume http://, passava a receber o 400 "The plain HTTP request was
        # sent to HTTPS port" do proprio nginx, em vez da aplicacao.
        #
        # 497 e o codigo interno do nginx para exatamente essa situacao (requisicao HTTP simples
        # chegando a um listener TLS). Trata-lo aqui devolve o redirect que o bloco da porta 80
        # fazia antes, sem precisar publicar uma segunda porta e sem afrouxar nada: quem chega em
        # texto claro e mandado para a MESMA origem sobre TLS, e so entao a aplicacao responde --
        # o cookie de sessao continua sendo emitido unicamente sobre HTTPS (ADR-0015, AC19).
        error_page 497 =301 https://$host:4200$request_uri;

        # Hardening barato, independente do que cada backend ja faz por conta propria: origem
        # unica atras de TLS ja e o requisito do AC19 (cookie Secure), estes cabecalhos so evitam
        # que o browser seja enganado a tratar essa origem de outro jeito.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        root /usr/share/nginx/html;
        index index.html;

        # bff-gerente ja tem context-path /bff (F5); o proxy so preserva o prefixo e informa a
        # origem publica via X-Forwarded-*, para que server.forward-headers-strategy=framework
        # calcule redirect_uri e baseUrl como https://localhost:4200/bff/..., nao o host interno do
        # container.
        location /bff/ {
            proxy_pass http://bff-gerente:8082/bff/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 4200;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # O unico pedaco de servidor-autorizacao que o navegador precisa alcancar diretamente:
        # o redirect de /oauth2/authorize e a pagina de login que ele serve. Token, jwks e
        # userinfo sao chamadas servidor-a-servidor de bff-gerente, direto pela rede interna do
        # Compose -- nunca passam por aqui (ver AUTH_SERVER_ISSUER_URI x AUTH_SERVER_URL_PUBLICA
        # em bff-gerente/application.yml).
        location /oauth2/ {
            proxy_pass http://servidor-autorizacao:9000/oauth2/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 4200;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /login {
            proxy_pass http://servidor-autorizacao:9000/login;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 4200;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # RP-Initiated Logout (OIDC): /connect/logout e o end-session endpoint do
        # servidor-autorizacao. Como /oauth2/ e /login, e o browser quem navega ate ele -- o
        # cookie de sessao SSO viaja nessa navegacao, e e ela que encerra a sessao la.
        location /connect/ {
            proxy_pass http://servidor-autorizacao:9000/connect/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 4200;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
