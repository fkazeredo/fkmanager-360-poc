worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # HTTP so redireciona: o cookie de sessao do bff-gerente e Secure de proposito (ADR-0015),
    # e so faz sentido exercitado sobre TLS de verdade -- nao HTTP disfarcado.
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/dev-localhost.crt;
        ssl_certificate_key /etc/nginx/certs/dev-localhost.key;

        root /usr/share/nginx/html;
        index index.html;

        # bff-gerente ja tem context-path /bff (F5); o proxy so preserva o prefixo e informa a
        # origem publica via X-Forwarded-*, para que server.forward-headers-strategy=framework
        # calcule redirect_uri e baseUrl como https://localhost/bff/..., nao o host interno do
        # container.
        location /bff/ {
            proxy_pass http://bff-gerente:8082/bff/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
