spring:
  application:
    name: fk-servico-credito
  # AC27 / plano #0003, "Taxonomia de parsing": campos numericos (limiteSolicitado,
  # limiteVigenteVisto) sao Long boxed no request DTO -- um valor com fracao como 600000.5
  # precisa FALHAR na desserializacao (400 COMANDO_ILEGIVEL), nunca ser truncado silenciosamente
  # para 600000 e seguir para a validacao semantica (422).
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${CREDITO_DB_JDBC_URL}
    username: ${CREDITO_DB_APP_USER}
    password: ${CREDITO_DB_APP_PASSWORD}
  # Migracao embutida (ADR-0014, emenda 2026-09-02): DataSource proprio e independente do
  # spring.datasource.* acima -- a query da aplicacao (JdbcClient) nunca ve a credencial de DDL,
  # mesmo rodando no mesmo processo.
  flyway:
    url: ${CREDITO_DB_JDBC_URL}
    user: ${CREDITO_DB_MIGRATOR_USER}
    password: ${CREDITO_DB_MIGRATOR_PASSWORD}
  jpa:
    hibernate:
      # Flyway continua soberano sobre o schema (ADR-0014): validate so confere o mapeamento
      # contra o schema ja migrado, nunca create/altera nada. Hibernate usa spring.datasource.*
      # (credencial app), nunca spring.flyway.* (credencial migrator).
      ddl-auto: validate
    # Sem lazy loading acidental fora da transacao -- a entity so e acessada dentro do escopo do
    # adapter/fragment transacional, e o open session in view esconderia esse limite.
    open-in-view: false
  security:
    oauth2:
      # Resource Server: valida os tokens que chegam.
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_ISSUER_URI:}
      # Client: servico-credito tambem e OAuth client, para continuar a operacao em nome do
      # usuario contra servico-carteira-clientes por Token Exchange (ADR-0015). O scope pedido e
      # somente carteira.leitura -- a troca REDUZ capability em relacao ao token recebido, que
      # carrega credito.leitura e carteira.leitura, e nunca introduz scope novo.
      client:
        registration:
          carteira-clientes-exchange:
            provider: servidor-autorizacao
            client-id: ${AUTH_SERVER_CREDITO_CLIENT_ID:servico-credito}
            client-secret: ${AUTH_SERVER_CREDITO_CLIENT_SECRET:troque-este-client-secret}
            authorization-grant-type: "urn:ietf:params:oauth:grant-type:token-exchange"
            scope: carteira.leitura
        provider:
          servidor-autorizacao:
            # Endpoint explicito, nao issuer-uri: issuer-uri dispararia descoberta OIDC na
            # inicializacao do contexto, criando dependencia de ordem de startup.
            token-uri: ${AUTH_SERVER_ISSUER_URI:http://localhost:9000}/oauth2/token

credito:
  core-legado:
    base-url: ${CORE_LEGADO_BASE_URL}
    connect-timeout: PT2S
    read-timeout: PT3S
  carteira-clientes:
    base-url: ${CARTEIRA_CLIENTES_BASE_URL}
    connect-timeout: PT2S
    read-timeout: PT5S
    # nome logico, nao URI absoluta (RFC 8693: "resource" exige URI, "audience" nao).
    audience: servico-carteira-clientes
  # aud esperado neste servico, validado pelo AudienceValidator alem do issuer padrao do Spring.
  security:
    expected-audience: servico-credito

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
