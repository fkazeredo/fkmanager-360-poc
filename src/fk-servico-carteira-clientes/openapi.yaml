openapi: 3.1.0
info:
  title: fk-servico-carteira-clientes
  description: "Resource Server do bounded context CarteiraClientes: autoridade sobre\
    \ a associacao atual GerenteRelacionamento-Cliente. Expoe a listagem paginada\
    \ da carteira do gerente autenticado, as ContaCorrentes de um Cliente e o contexto\
    \ de atendimento de uma conta -- tudo composto com dados lidos de fk-simulador-core-legado\
    \ pela ACL propria deste contexto (ADR-0004). Nao e fachada financeira: nao conhece\
    \ LimiteChequeEspecial (ADR-0004, AC30). Em toda consulta por Cliente, o direito\
    \ de atendimento ATUAL e verificado na persistencia local ANTES de qualquer chamada\
    \ ao CoreLegado (AC23)."
  version: "0002"
servers:
- url: http://localhost:8081
  description: "Rede interna do Docker Compose (nome de servico), porta exposta localmente\
    \ para dev."
tags:
- name: atendimento
  description: ContaCorrentes de um Cliente e contexto de atendimento por conta. Toda
    operacao aqui e precedida da verificacao local do direito de atendimento atual
    (ADR-0007).
- name: carteira
  description: Leitura da CarteiraClientes do gerente autenticado.
paths:
  /clientes/{clienteId}/contas:
    get:
      tags:
      - atendimento
      summary: ContaCorrentes de um Cliente da carteira do gerente autenticado
      description: "Completa o AC22: selecionar um Cliente devolve suas ContaCorrentes.\
        \ Sem paginacao -- a quantidade de contas de um Cliente e naturalmente pequena\
        \ (ADR-0010)."
      operationId: listarContasDoCliente
      parameters:
      - name: clienteId
        in: path
        description: "Identificador do Cliente, sem zero-padding."
        required: true
        schema:
          type: string
          pattern: "^[0-9]{1,10}$"
        example: 1
      responses:
        "200":
          description: Contas que o CoreLegado reconhece para aquele Cliente.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContasResponse"
        "401":
          description: Sem token valido para este Resource Server.
        "403":
          description: Sem direito de atendimento atual sobre aquele Cliente -- nenhuma
            chamada ao CoreLegado e emitida (AC23). Tambem 403 sem o scope carteira.leitura
            ou sem o papel GERENTE_RELACIONAMENTO.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: fk-simulador-core-legado respondeu algo que a ACL nao sabe
            interpretar.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: fk-simulador-core-legado indisponivel.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "504":
          description: Timeout ao consultar fk-simulador-core-legado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerJwt:
        - carteira.leitura
  /clientes/{clienteId}/contas/{contaId}/direito-de-atendimento:
    get:
      tags:
      - atendimento
      summary: "Confirma o direito de atendimento sobre uma conta, sem dado cadastral\
        \ algum"
      description: "Operacao estreita de autorizacao (AC23): confirma vinculo atual\
        \ com o Cliente e que a conta pedida e dele segundo o CoreLegado, sem devolver\
        \ nome, CPF ou qualquer outro dado cadastral. E o que fk-servico-credito consome\
        \ (AC21)."
      operationId: confirmarDireitoDeAtendimento
      parameters:
      - name: clienteId
        in: path
        description: "Identificador do Cliente, sem zero-padding."
        required: true
        schema:
          type: string
          pattern: "^[0-9]{1,10}$"
        example: 1
      - name: contaId
        in: path
        description: "Identificador da ContaCorrente, sem zero-padding."
        required: true
        schema:
          type: string
          pattern: "^[0-9]{1,10}$"
        example: 10001
      responses:
        "204":
          description: "O gerente tem direito de atendimento atual sobre o Cliente,\
            \ e o CoreLegado confirma que a conta e dele. Sem corpo."
        "401":
          description: Sem token valido para este Resource Server.
        "403":
          description: Sem direito de atendimento atual sobre aquele Cliente -- nenhuma
            chamada ao CoreLegado e emitida (AC23).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: A conta nao esta entre as que o CoreLegado reconhece para aquele
            Cliente.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: fk-simulador-core-legado respondeu algo que a ACL nao sabe
            interpretar.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: fk-simulador-core-legado indisponivel.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "504":
          description: Timeout ao consultar fk-simulador-core-legado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerJwt:
        - carteira.leitura
  /clientes/{clienteId}/contas/{contaId}/contexto-atendimento:
    get:
      tags:
      - atendimento
      summary: Contexto de atendimento de uma conta -- identidade do Cliente e a conta
        atendida
      description: "Operacao rica, consumida por fk-bff-gerente para compor a tela\
        \ de atendimento com nome, CPF e conta (AC30). fk-servico-credito NAO consome\
        \ esta operacao -- usa a operacao estreita /direito-de-atendimento."
      operationId: consultarContextoAtendimento
      parameters:
      - name: clienteId
        in: path
        description: "Identificador do Cliente, sem zero-padding."
        required: true
        schema:
          type: string
          pattern: "^[0-9]{1,10}$"
        example: 1
      - name: contaId
        in: path
        description: "Identificador da ContaCorrente, sem zero-padding."
        required: true
        schema:
          type: string
          pattern: "^[0-9]{1,10}$"
        example: 10001
      responses:
        "200":
          description: "O gerente tem direito de atendimento atual sobre o Cliente,\
            \ e o CoreLegado confirma que a conta e dele."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContextoAtendimentoResponse"
        "401":
          description: Sem token valido para este Resource Server.
        "403":
          description: Sem direito de atendimento atual sobre aquele Cliente -- nenhuma
            chamada ao CoreLegado e emitida (AC23).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "A conta nao esta entre as que o CoreLegado reconhece para\
            \ aquele Cliente. 404, e nao 403: a autorizacao sobre o Cliente ja passou."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: fk-simulador-core-legado respondeu algo que a ACL nao sabe
            interpretar.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: fk-simulador-core-legado indisponivel.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "504":
          description: Timeout ao consultar fk-simulador-core-legado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerJwt:
        - carteira.leitura
  /carteira/clientes:
    get:
      tags:
      - carteira
      summary: Pagina de Clientes da CarteiraClientes do gerente autenticado
      description: "O gerenteId vem do claim sub do token bearer ja validado pela\
        \ borda (issuer + audience); este endpoint nao reimplementa autenticacao (AC22,\
        \ ADR-0007)."
      operationId: listarClientesDaCarteira
      parameters:
      - name: pagina
        in: query
        description: Pagina zero-based.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: tamanho
        in: query
        description: Tamanho de pagina (1-100).
        required: false
        schema:
          type: integer
          format: int32
          default: 20
        example: 20
      responses:
        "200":
          description: Pagina da carteira do gerente autenticado.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClientesPageResponse"
        "400":
          description: "Parametro de paginacao invalido (pagina negativa, ou tamanho\
            \ fora de 1-100)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Sem token, token expirado, assinatura invalida, issuer incorreto\
            \ ou audience incorreta (AC21)."
        "403":
          description: "Token valido mas sem o scope carteira.leitura ou sem o papel\
            \ GERENTE_RELACIONAMENTO (ADR-0015: scope e papel sao perguntas distintas,\
            \ ambos precisam valer)."
        "502":
          description: fk-simulador-core-legado respondeu algo que a ACL nao sabe
            interpretar.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: fk-simulador-core-legado indisponivel.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "504":
          description: Timeout ao consultar fk-simulador-core-legado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerJwt:
        - carteira.leitura
components:
  schemas:
    ContaResumoResponse:
      type: object
      properties:
        contaId:
          type: string
          example: 10001
        agencia:
          type: string
          example: "0001"
      required:
      - agencia
      - contaId
    ContasResponse:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ContaResumoResponse"
      required:
      - itens
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    ContextoAtendimentoResponse:
      type: object
      properties:
        clienteId:
          type: string
          description: O clienteId autoritativo -- o unico campo que fk-servico-credito
            consome.
          example: 1
        nome:
          type: string
        cpfMascarado:
          type: string
          example: '***.456.789-**'
        conta:
          $ref: "#/components/schemas/ContaResumoResponse"
      required:
      - clienteId
      - conta
      - cpfMascarado
      - nome
    ClienteResumoResponse:
      type: object
      properties:
        clienteId:
          type: string
          example: 1
        nome:
          type: string
        cpfMascarado:
          type: string
          example: '***.456.789-**'
      required:
      - clienteId
      - cpfMascarado
      - nome
    ClientesPageResponse:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ClienteResumoResponse"
        pagina:
          type: integer
          format: int32
        tamanho:
          type: integer
          format: int32
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
          format: int64
      required:
      - itens
      - pagina
      - tamanho
      - totalElementos
      - totalPaginas
  securitySchemes:
    bearerJwt:
      type: http
      description: "Token emitido por fk-servidor-autorizacao (Token Exchange a partir\
        \ da sessao do fk-bff-gerente), com aud=servico-carteira-clientes e scope\
        \ carteira.leitura."
      scheme: bearer
      bearerFormat: JWT
