openapi: 3.0.3
info:
  title: fk-servico-carteira-clientes
  description: >-
    Resource Server do bounded context CarteiraClientes: autoridade sobre a associacao atual
    GerenteRelacionamento-Cliente. Expoe a listagem paginada da carteira do gerente autenticado,
    as ContaCorrentes de um Cliente e o contexto de atendimento de uma conta -- tudo composto com
    dados lidos de fk-simulador-core-legado pela ACL propria deste contexto (ADR-0004). Nao e
    fachada financeira: nao conhece LimiteChequeEspecial (ADR-0004, AC30).

    Em toda consulta por Cliente, o direito de atendimento ATUAL e verificado na persistencia
    local ANTES de qualquer chamada ao CoreLegado; sem direito, a resposta e 403 e nenhuma
    consulta externa acontece (AC23). O Core e sempre consultado pela chave ja autorizada -- as
    contas daquele Cliente --, e a pertinencia da conta e confirmada contra essa resposta
    autoritativa, nunca contra o que o chamador afirmou.
  version: "0002"
servers:
  - url: http://localhost:8081
    description: Rede interna do Docker Compose (nome de servico), porta exposta localmente para dev.
tags:
  - name: carteira
    description: Leitura da CarteiraClientes do gerente autenticado.
  - name: atendimento
    description: >-
      ContaCorrentes de um Cliente e contexto de atendimento por conta. Toda operacao aqui e
      precedida da verificacao local do direito de atendimento atual (ADR-0007).
paths:
  /carteira/clientes:
    get:
      operationId: listarClientesDaCarteira
      tags: [carteira]
      summary: Pagina de Clientes da CarteiraClientes do gerente autenticado
      description: >-
        O gerenteId vem do claim sub do token bearer ja validado pela borda (issuer + audience);
        este endpoint nao reimplementa autenticacao (AC22, ADR-0007).
      security:
        - bearerJwt: [carteira.leitura]
      parameters:
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Pagina zero-based.
        - name: tamanho
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Tamanho de pagina (1-100).
      responses:
        "200":
          description: Pagina da carteira do gerente autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientesPageResponse"
        "400":
          description: Parametro de paginacao invalido (pagina negativa, ou tamanho fora de 1-100).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: >-
            Sem token, token expirado, assinatura invalida, issuer incorreto ou audience
            incorreta (AC21).
        "403":
          description: >-
            Token valido mas sem o scope carteira.leitura ou sem o papel GERENTE_RELACIONAMENTO
            (ADR-0015: scope e papel sao perguntas distintas, ambos precisam valer).
        "502":
          description: fk-simulador-core-legado respondeu algo que a ACL nao sabe interpretar.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: fk-simulador-core-legado indisponivel.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "504":
          description: Timeout ao consultar fk-simulador-core-legado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /clientes/{clienteId}/contas:
    get:
      operationId: listarContasDoCliente
      tags: [atendimento]
      summary: ContaCorrentes de um Cliente da carteira do gerente autenticado
      description: >-
        Completa o AC22: selecionar um Cliente devolve suas ContaCorrentes. Sem paginacao -- a
        quantidade de contas de um Cliente e naturalmente pequena, e paginar aqui seria
        infraestrutura sem necessidade (ADR-0010).
      security:
        - bearerJwt: [carteira.leitura]
      parameters:
        - $ref: "#/components/parameters/ClienteIdPath"
      responses:
        "200":
          description: Contas que o CoreLegado reconhece para aquele Cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContasResponse"
        "401":
          description: Sem token valido para este Resource Server.
        "403":
          description: >-
            Sem direito de atendimento atual sobre aquele Cliente -- e NENHUMA chamada ao
            CoreLegado e emitida (AC23). Tambem 403 sem o scope carteira.leitura ou sem o papel
            GERENTE_RELACIONAMENTO.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: fk-simulador-core-legado respondeu algo que a ACL nao sabe interpretar.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: fk-simulador-core-legado indisponivel.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "504":
          description: Timeout ao consultar fk-simulador-core-legado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /clientes/{clienteId}/contas/{contaId}/direito-de-atendimento:
    get:
      operationId: confirmarDireitoDeAtendimento
      tags: [atendimento]
      summary: Confirma o direito de atendimento sobre uma conta, sem dado cadastral algum
      description: >-
        A operacao estreita de autorizacao (AC23): confirma que o gerente autenticado tem
        vinculo atual com o Cliente e que a conta pedida pertence de fato a ele segundo o
        CoreLegado, sem devolver nome, CPF ou qualquer outro dado cadastral.

        E o que fk-servico-credito consome para continuar a operacao (AC21) -- por nao invocar a
        consulta de dados mestres do Cliente, uma indisponibilidade dessa consulta cadastral
        nunca pode bloquear a leitura do LimiteChequeEspecialVigente. fk-bff-gerente, que precisa
        do nome e do CPF para compor a tela, usa a operacao rica em
        `/contexto-atendimento` (AC30).
      security:
        - bearerJwt: [carteira.leitura]
      parameters:
        - $ref: "#/components/parameters/ClienteIdPath"
        - name: contaId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]{1,10}$"
          description: Identificador da ContaCorrente, sem zero-padding.
      responses:
        "204":
          description: >-
            O gerente tem direito de atendimento atual sobre o Cliente, e o CoreLegado confirma
            que a conta e dele. Sem corpo: nenhum consumidor precisa de mais do que a resposta
            binaria -- os dois identificadores ja vieram no caminho da propria requisicao.
        "401":
          description: Sem token valido para este Resource Server.
        "403":
          description: >-
            Sem direito de atendimento atual sobre aquele Cliente -- e NENHUMA chamada ao
            CoreLegado e emitida (AC23).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: >-
            A conta nao esta entre as que o CoreLegado reconhece para aquele Cliente.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: fk-simulador-core-legado respondeu algo que a ACL nao sabe interpretar.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: fk-simulador-core-legado indisponivel.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "504":
          description: Timeout ao consultar fk-simulador-core-legado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /clientes/{clienteId}/contas/{contaId}/contexto-atendimento:
    get:
      operationId: consultarContextoAtendimento
      tags: [atendimento]
      summary: Contexto de atendimento de uma conta -- identidade do Cliente e a conta atendida
      description: >-
        Operacao rica, consumida por fk-bff-gerente para compor a tela de atendimento com nome,
        CPF e conta (AC30). fk-servico-credito NAO consome esta operacao -- usa a operacao
        estreita `/direito-de-atendimento`, exatamente para nao ficar acoplado a
        disponibilidade da consulta cadastral que ele nunca usa.
      security:
        - bearerJwt: [carteira.leitura]
      parameters:
        - $ref: "#/components/parameters/ClienteIdPath"
        - name: contaId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9]{1,10}$"
          description: Identificador da ContaCorrente, sem zero-padding.
      responses:
        "200":
          description: >-
            O gerente tem direito de atendimento atual sobre o Cliente, e o CoreLegado confirma
            que a conta e dele.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextoAtendimentoResponse"
        "401":
          description: Sem token valido para este Resource Server.
        "403":
          description: >-
            Sem direito de atendimento atual sobre aquele Cliente -- e NENHUMA chamada ao
            CoreLegado e emitida (AC23).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: >-
            A conta nao esta entre as que o CoreLegado reconhece para aquele Cliente. 404, e nao
            403: a autorizacao sobre o Cliente ja passou, e responder assim nao revela nada sobre
            contas de outros Clientes -- a pergunta so foi feita ao Core depois da autorizacao.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: fk-simulador-core-legado respondeu algo que a ACL nao sabe interpretar.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: fk-simulador-core-legado indisponivel.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "504":
          description: Timeout ao consultar fk-simulador-core-legado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  parameters:
    ClienteIdPath:
      name: clienteId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]{1,10}$"
      description: >-
        Identificador do Cliente, sem zero-padding (a formatacao host e da ACL). E a chave que
        torna possivel verificar o direito de atendimento antes de qualquer acesso ao Core; nao e
        aceito como afirmacao sobre a quem a conta pertence.
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token emitido por fk-servidor-autorizacao (Token Exchange a partir da sessao do
        fk-bff-gerente), com aud=servico-carteira-clientes e scope carteira.leitura.
  schemas:
    ClienteResumo:
      type: object
      required: [clienteId, nome, cpfMascarado]
      properties:
        clienteId:
          type: string
        nome:
          type: string
        cpfMascarado:
          type: string
          example: "***.456.789-**"
    ContaResumo:
      type: object
      required: [contaId, agencia]
      description: >-
        Identificacao da ContaCorrente, e nada mais: limite, saldo e situacao pertencem a Credito,
        pela ACL daquele contexto (ADR-0004, AC30).
      properties:
        contaId:
          type: string
          example: "10001"
        agencia:
          type: string
          example: "0001"
    ContasResponse:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ContaResumo"
    ContextoAtendimentoResponse:
      type: object
      required: [clienteId, nome, cpfMascarado, conta]
      properties:
        clienteId:
          type: string
          description: O clienteId autoritativo -- o unico campo que fk-servico-credito consome.
        nome:
          type: string
        cpfMascarado:
          type: string
          example: "***.456.789-**"
        conta:
          $ref: "#/components/schemas/ContaResumo"
    ClientesPageResponse:
      type: object
      required: [itens, pagina, tamanho, totalElementos, totalPaginas]
      properties:
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ClienteResumo"
        pagina:
          type: integer
        tamanho:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
          format: int64
    ProblemDetail:
      type: object
      description: RFC 7807 (org.springframework.http.ProblemDetail).
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
