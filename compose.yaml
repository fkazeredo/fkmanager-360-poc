# Contrato oficial de execucao integrada (ADR-0013). Toda infraestrutura roda em container --
# nunca instalada nativamente no host (ADR-0013, emenda "infraestrutura em Docker"). Antes do
# primeiro `docker compose up`, rode scripts/gerar-segredos-dev.ps1 para criar .env e o
# certificado TLS local.
#
# Cada build usa a raiz do repositorio como contexto: o reactor Maven precisa do pom.xml
# agregador para resolver o parent de cada modulo (ADR-0011).

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      CARTEIRA_DB_MIGRATOR_PASSWORD: ${CARTEIRA_DB_MIGRATOR_PASSWORD}
      CARTEIRA_DB_APP_PASSWORD: ${CARTEIRA_DB_APP_PASSWORD}
    volumes:
      # postgres 18+ organiza o PGDATA por versao maior sob /var/lib/postgresql (pg_ctlcluster-
      # style); montar o volume direto em .../data e a convencao antiga e o entrypoint recusa
      # subir mesmo com o volume vazio (docker-library/postgres#1259).
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      # command: e resolvido pelo Compose a partir do .env do host no parse -- o healthcheck roda
      # dentro do container e precisa da variavel no ambiente dele para o $$REDIS_PASSWORD expandir.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulador-core-legado:
    build:
      context: .
      dockerfile: src/fk-simulador-core-legado/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  servidor-autorizacao:
    build:
      context: .
      dockerfile: src/fk-servidor-autorizacao/Dockerfile
    environment:
      # DNS interno: o claim "iss" dos tokens nao precisa ser o endereco que o navegador ve
      # (AUTH_SERVER_PUBLIC_URL, usado por bff-gerente) -- so precisa ser estavel e alcancavel
      # por todo Resource Server que valida esses tokens.
      AUTH_SERVER_ISSUER_URI: http://servidor-autorizacao:9000
      AUTH_SERVER_SIGNING_KEY_PRIVATE: ${AUTH_SERVER_SIGNING_KEY_PRIVATE}
      AUTH_SERVER_SIGNING_KEY_PUBLIC: ${AUTH_SERVER_SIGNING_KEY_PUBLIC}
      AUTH_SERVER_BFF_CLIENT_ID: ${AUTH_SERVER_BFF_CLIENT_ID}
      AUTH_SERVER_BFF_CLIENT_SECRET: ${AUTH_SERVER_BFF_CLIENT_SECRET}
      AUTH_SERVER_BFF_REDIRECT_URI: ${AUTH_SERVER_BFF_REDIRECT_URI}
      AUTH_SERVER_BFF_POST_LOGOUT_REDIRECT_URI: ${AUTH_SERVER_BFF_POST_LOGOUT_REDIRECT_URI}
      AUTH_SERVER_DEMO_USERS: ${AUTH_SERVER_DEMO_USERS}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 10

  servico-carteira-clientes:
    build:
      context: .
      dockerfile: src/fk-servico-carteira-clientes/Dockerfile
    environment:
      CARTEIRA_DB_JDBC_URL: jdbc:postgresql://postgres:5432/${CARTEIRA_DB_NAME}
      CARTEIRA_DB_APP_USER: ${CARTEIRA_DB_APP_USER}
      CARTEIRA_DB_APP_PASSWORD: ${CARTEIRA_DB_APP_PASSWORD}
      # Migracao embutida (ADR-0014, emenda 2026-09-02): credencial de DDL separada da credencial
      # de DML acima -- Flyway roda no boot com esta, o JdbcClient da API nunca a ve.
      CARTEIRA_DB_MIGRATOR_USER: ${CARTEIRA_DB_MIGRATOR_USER}
      CARTEIRA_DB_MIGRATOR_PASSWORD: ${CARTEIRA_DB_MIGRATOR_PASSWORD}
      CORE_LEGADO_BASE_URL: http://simulador-core-legado:8090
      AUTH_SERVER_ISSUER_URI: http://servidor-autorizacao:9000
    depends_on:
      postgres:
        condition: service_healthy
      simulador-core-legado:
        condition: service_healthy
      servidor-autorizacao:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  bff-gerente:
    build:
      context: .
      dockerfile: src/fk-bff-gerente/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_SERVER_ISSUER_URI: http://servidor-autorizacao:9000
      AUTH_SERVER_PUBLIC_URL: ${AUTH_SERVER_PUBLIC_URL}
      AUTH_SERVER_BFF_CLIENT_ID: ${AUTH_SERVER_BFF_CLIENT_ID}
      AUTH_SERVER_BFF_CLIENT_SECRET: ${AUTH_SERVER_BFF_CLIENT_SECRET}
      CARTEIRA_CLIENTES_BASE_URL: http://servico-carteira-clientes:8081
    depends_on:
      redis:
        condition: service_healthy
      servidor-autorizacao:
        condition: service_healthy
      servico-carteira-clientes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/bff/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-gerente:
    build:
      context: .
      dockerfile: src/fk-app-gerente/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_TLS_CERT_PATH}:/etc/nginx/certs/dev-localhost.crt:ro
      - ${NGINX_TLS_KEY_PATH}:/etc/nginx/certs/dev-localhost.key:ro
    depends_on:
      bff-gerente:
        condition: service_healthy
      servidor-autorizacao:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
